<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Layer Requisition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Antonio:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/kit.css">
<style>
.stage { background: #c9cac3; color: var(--paper-ink); }
.ground { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 20%, #dcddd6, #b9bab3 80%); }
.ground::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(0, 0, 0, .55) 0 30%, transparent 36%) 0 0 / 7px 7px; mix-blend-mode: multiply; opacity: .12; }
.wm { position: absolute; color: #1d2123; pointer-events: none; }
.wm svg { width: 100%; height: 100%; }
.stage .grain { opacity: .12; mix-blend-mode: multiply; }
.stage .scan { opacity: .25; }

.ttl { position: absolute; left: 0; top: 52px; background: #14181a; color: var(--ink); padding: 16px 70px 14px 80px; font: 700 52px/.95 var(--head); letter-spacing: .1em; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, calc(100% - 30px) 100%, 0 100%); }
.ttl small { display: block; margin-top: 8px; font: 500 20px/1 var(--head); letter-spacing: .4em; color: var(--ink-3); }
.pts { position: absolute; right: 80px; top: 56px; display: flex; align-items: stretch; height: 74px; }
.pts .lb { display: flex; align-items: center; gap: 12px; padding: 0 22px; background: #14181a; color: var(--ink); font: 600 20px/1 var(--head); letter-spacing: .26em; text-transform: uppercase; }
.pts .lb svg { width: 26px; height: 30px; }
.pts .n { min-width: 200px; display: flex; align-items: center; justify-content: flex-end; padding: 0 22px; background: #f4f4f1; border: 3px solid #14181a; border-left: 0; font: 700 56px/1 var(--head); letter-spacing: .04em; }
.pts.flash .n { animation: pn .5s steps(2) 2; }
@keyframes pn { 50% { background: var(--red); color: #fff; } }

.tabs { position: absolute; left: 80px; top: 196px; display: flex; gap: 6px; }
.tab { display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 28px 0 20px; background: rgba(20, 24, 26, .14); border: 2px solid rgba(20, 24, 26, .4); border-bottom: 0; color: #4a4f50; font: 600 24px/1 var(--head); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 100%, 0 100%); }
.tab svg { width: 32px; height: 28px; }
.tab[aria-selected="true"] { background: #14181a; border-color: #14181a; color: var(--ink); }
.tabline { position: absolute; left: 80px; width: 1000px; top: 256px; height: 4px; background: #14181a; }
.cat { position: absolute; left: 80px; top: 282px; font: 600 32px/1 var(--head); letter-spacing: .14em; text-transform: uppercase; }

.board { position: absolute; left: 80px; top: 350px; width: 1000px; }
.rk { display: grid; grid-template-columns: 250px repeat(4, 150px); height: 42px; align-items: end; font: 600 20px/1 var(--head); letter-spacing: .24em; color: #555a5b; padding-bottom: 8px; }
.rk span { text-align: left; } .rk small { margin-right: 8px; font-size: 16px; }
.rk b { font: 600 34px/1 var(--head); color: #14181a; letter-spacing: 0; }
.rw { position: relative; display: grid; grid-template-columns: 250px repeat(4, 150px); height: 132px; align-items: center; cursor: pointer; }
.rw::before { content: ""; position: absolute; left: 250px; top: 50%; width: 600px; height: 3px; margin-top: -26px; background: rgba(20, 24, 26, .35); }
.rw .lbl { padding-right: 20px; font: 600 26px/1.05 var(--head); letter-spacing: .1em; text-transform: uppercase; }
.rw .lbl small { display: block; margin-top: 8px; font: 500 16px/1 var(--head); letter-spacing: .2em; color: #555a5b; }
.rw[aria-selected="true"] .lbl { color: var(--red); }
.rw[aria-selected="true"]::after { content: ""; position: absolute; left: -26px; top: 50%; margin-top: -12px; border: 12px solid transparent; border-left: 18px solid var(--red); border-right: 0; }
.cl { position: relative; width: 122px; height: 104px; display: grid; place-items: center; font: 700 22px/1 var(--head); }
.cl svg { width: 56px; height: 50px; }
.cl .cnt { position: absolute; right: 8px; bottom: 6px; font-size: 24px; }
.cl.own { background: #14181a; color: var(--ink); }
.cl.next { background: #f4f4f1; color: #14181a; border: 3px solid #14181a; }
.cl.next.poor { border-style: dashed; color: #6a6f70; }
.cl.next .pr { position: absolute; left: -3px; right: -3px; bottom: -34px; display: flex; align-items: center; gap: 6px; font: 600 18px/1 var(--head); letter-spacing: .1em; color: var(--red); }
.cl.far { border: 3px dashed rgba(20, 24, 26, .28); color: rgba(20, 24, 26, .3); }
.cl.far svg { opacity: .4; }
.cl.lock { background: #14181a; color: var(--ink); }
.cl.lock svg { width: 40px; height: 40px; }
.rw[aria-selected="true"] .cl.next { outline: 4px solid var(--red); outline-offset: 3px; }
.rw[aria-selected="true"] .cl.next::before { content: ""; position: absolute; left: -12px; top: -12px; width: 16px; height: 16px; background: var(--red); }

.dwg { position: absolute; right: 80px; top: 150px; width: 700px; height: 790px; background: rgba(244, 244, 241, .93); border: 3px solid #14181a; padding: 26px 30px; }
.dwg .tag { position: absolute; right: -3px; top: -3px; padding: 8px 18px; background: #14181a; color: var(--ink); font: 600 16px/1 var(--head); letter-spacing: .26em; }
.dwg h2 { font: 700 54px/.95 var(--head); letter-spacing: .04em; text-transform: uppercase; }
.dwg .part { margin-top: 10px; font: 500 20px/1 var(--head); letter-spacing: .22em; color: #555a5b; text-transform: uppercase; }
.dwg .art { position: relative; height: 200px; margin: 18px 0; border-top: 2px solid #14181a; border-bottom: 2px solid #14181a; background: repeating-linear-gradient(0deg, transparent 0 19px, rgba(20, 24, 26, .1) 19px 20px), repeating-linear-gradient(90deg, transparent 0 19px, rgba(20, 24, 26, .1) 19px 20px); display: grid; place-items: center; }
.dwg .art { height: 330px; overflow: hidden; }
.dwg .art .iso { position: absolute; left: 50%; top: 50%; width: 350px; height: 306px; margin: -153px 0 0 -175px; transform-style: preserve-3d; transform: rotateX(58deg) rotateZ(-42deg); animation: isoin .3s steps(6) both, sway 9s ease-in-out .3s infinite alternate; }
.dwg .art .iso svg { position: absolute; inset: 0; width: 100%; height: 100%; }
@keyframes isoin { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(-40% -40% -40% -40%); } }
@keyframes sway { from { transform: rotateX(58deg) rotateZ(-48deg); } to { transform: rotateX(58deg) rotateZ(-36deg); } }
.dwg .art .sc { position: absolute; right: 12px; bottom: 8px; font: 600 16px/1 var(--head); letter-spacing: .24em; }
.dwg .eff { display: flex; align-items: center; gap: 22px; font: 600 24px/1 var(--head); letter-spacing: .16em; text-transform: uppercase; }
.dwg .eff .v { margin-left: auto; font: 700 56px/1 var(--head); letter-spacing: .02em; }
.dwg .eff .v i { font-style: normal; color: var(--red); }
.dwg .eff .v s { text-decoration: none; opacity: .4; }
.dwg p { margin-top: 20px; font: 400 21px/1.45 var(--body); color: #2f3436; min-height: 92px; }
.buy { position: absolute; left: 30px; right: 30px; bottom: 26px; display: flex; align-items: center; justify-content: center; gap: 16px; height: 68px; background: #14181a; color: var(--ink); font: 700 28px/1 var(--head); letter-spacing: .18em; text-transform: uppercase; cursor: pointer; clip-path: polygon(0 0, 100% 0, calc(100% - 24px) 100%, 0 100%); }
.buy:hover { background: var(--red); }
.buy.off { background: #8a8e8d; cursor: not-allowed; color: #d5d6d0; }
.buy .key { background: var(--ink); }

.ticker { position: absolute; left: 0; right: 0; bottom: 64px; height: 56px; display: flex; align-items: center; background: #14181a; color: var(--ink); font: 400 21px/1 var(--body); }
.ticker .tg { height: 100%; display: grid; place-items: center; padding: 0 28px; margin-right: 24px; background: var(--red); font: 700 18px/1 var(--head); letter-spacing: .3em; }
.pstrip { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 34px; padding: 0 80px; background: #0a0d0f; color: var(--ink-2); font: 600 20px/1 var(--head); letter-spacing: .18em; text-transform: uppercase; }
.pstrip span { display: inline-flex; align-items: center; gap: 10px; }
.pstrip .r { margin-left: auto; }
.pstrip .key { background: var(--ink); }
</style>
</head>
<body>
<div class="mockbar" role="toolbar" aria-label="Mock controls">
  <span class="title">Ghost Layer · Requisition</span>
  <a href="index.html">All screens</a><span class="sep"></span>
  <button id="t-reset">Reset points</button>
  <button id="t-replay">Replay</button><span class="grow"></span>
  <span class="hint">↑ ↓ pick · ← → tab · E requisition</span><span class="sep"></span>
  <button id="t-lang" aria-pressed="false">Español</button>
</div>
<div class="viewport"><div class="stage" id="stage">
  <div class="ground"></div>
  <div class="wm a f" style="left:900px;top:-180px;width:1100px;height:1100px;opacity:.07;--d:.1s"><svg><use href="#emblem"/></svg></div>
  <div class="wm" style="left:-100px;top:560px;width:760px;height:660px;opacity:.07;filter:blur(5px)"><svg viewBox="0 0 64 56"><use href="#i-cells"/></svg></div>
  <div class="wm" style="left:560px;top:520px;width:600px;height:520px;opacity:.06;filter:blur(6px)"><svg viewBox="0 0 64 56"><use href="#i-balloon"/></svg></div>

  <div class="ttl a l"><span data-es="METIS<br>REQUISICIÓN">METIS<br>REQUISITION</span></div>
  <div class="pts a r" id="pts" style="--d:.1s"><span class="lb"><svg><use href="#i-recruit"/></svg><span data-es="Reclutas">Recruits</span></span><span class="n num" id="pointsN">7</span></div>

  <div class="tabs a" style="--d:.2s">
    <div class="tab" data-tab="0" aria-selected="true"><svg viewBox="0 0 64 56"><use href="#i-cells"/></svg><span id="tab0" data-es="Mejoras de equipo">Gear upgrades</span></div>
    <div class="tab" data-tab="1" aria-selected="false"><svg viewBox="0 0 64 56"><use href="#i-scanner"/></svg><span id="tab1" data-es="Objetos de rango S">S-rank items</span></div>
  </div>
  <div class="tabline a w" style="--d:.25s"></div>
  <div class="cat" id="cat"></div>

  <div class="board a" style="--d:.3s" id="board"></div>
  <div class="dwg a r" style="--d:.35s" id="dwg"></div>

  <div class="ticker"><span class="tg">METIS</span><span id="metis"></span></div>
  <div class="pstrip"><span><span class="key sm">↑↓</span><span data-es="Elegir">Select</span></span><span><span class="key sm">←→</span><span data-es="Pestaña">Tab</span></span><span><span class="key sm">E</span><span data-es="Requisar">Requisition</span></span><span class="r"><span class="key sm">Esc</span><span data-es="Atrás">Back</span></span></div>
  
</div></div>
<script src="kit/sprite.js"></script>
<script src="kit/kit.js"></script>
<script>
const UPG = [
  { id: 'scanner', icon: 'i-cells', part: ['Cell pack, 2 × Ø35', 'Pack de celdas, 2 × Ø35'], scale: '1:2', name: ['Scanner cells', 'Celdas del escáner'], eff: ['Scanner charges', 'Cargas del escáner'], base: 3, step: 1, buys: 2, price: 3,
    desc: ['Spare cells for the field scanner. Each charge shows every guard and camera within 30 m for ten seconds.', 'Celdas de repuesto para el escáner. Cada carga muestra guardias y cámaras a 30 m durante diez segundos.'] },
  { id: 'magazines', icon: 'i-pouch', part: ['Magazine pouch', 'Portacargadores'], scale: '1:3', name: ['Magazine pouch', 'Portacargadores'], eff: ['Magazines', 'Cargadores'], base: 4, step: 2, buys: 2, price: 2,
    desc: ['Two more empty magazines on the belt. Throw one to pull a guard toward the noise.', 'Dos cargadores vacíos más en el cinturón. Lanza uno para atraer a un guardia hacia el ruido.'] },
  { id: 'fultons', icon: 'i-balloon', part: ['Fulton balloon, packed', 'Globo Fulton, plegado'], scale: '1:10', name: ['Spare balloon', 'Globo de repuesto'], eff: ['Fulton balloons', 'Globos Fulton'], base: 3, step: 1, buys: 2, price: 4,
    desc: ['One more Fulton per Mission. Every guard lifted out is a Recruit for Metis after a first clear.', 'Un Fulton más por misión. Cada guardia extraído es un recluta para Metis tras una primera victoria.'] },
  { id: 'darts', icon: 'i-darts', part: ['Dart reserve tube', 'Tubo de dardos'], scale: '1:1', name: ['Dart reserve', 'Reserva de dardos'], eff: ['Tranq darts', 'Dardos tranq.'], base: 8, step: 4, buys: 1, price: 5,
    desc: ['A reserve tube for the tranq pistol: four more sleep darts per Mission.', 'Un tubo de reserva para la pistola tranq.: cuatro dardos más por misión.'] },
];
const ITEMS = [
  { id: 'long_scan', icon: 'i-scanner', part: ['Scanner emitter, long', 'Emisor de escáner, largo'], scale: '1:2', name: ['Long scan', 'Escaneo largo'], eff: ['Scanner lasts', 'Duración del escáner'], from: '10 s', to: '15 s', unlocked: true, mission: 1,
    desc: ['Earned with an S rank on the Harbour. The scanner holds its picture five seconds longer.', 'Ganado con rango S en el Puerto. El escáner mantiene la imagen cinco segundos más.'] },
  { id: 'heavy_suppressor', icon: 'i-suppressor', part: ['Suppressor, 5-shot', 'Supresor, 5 disparos'], scale: '1:2', name: ['Heavy suppressor', 'Supresor pesado'], eff: ['Suppressor lasts', 'Duración del supresor'], from: '3', to: '5', unlocked: false, mission: 2,
    desc: ['Clear the Relay Station with an S rank to earn it.', 'Supera la Estación de Relé con rango S para ganarlo.'] },
  { id: 'quick_hold', icon: 'i-hold', part: ['Quick-hold clip', 'Enganche rápido'], scale: '1:1', name: ['Quick hold', 'Enganche rápido'], eff: ['Fulton hold', 'Tiempo de Fulton'], from: '3 s', to: '2 s', unlocked: false, mission: 3,
    desc: ['Clear the Research Annex with an S rank to earn it.', 'Supera el Anexo de Investigación con rango S para ganarlo.'] },
];
const T = {
  cat: [['Gear upgrades', 'Mejoras de equipo'], ['S-rank items', 'Objetos de rango S']], rank: ['Rank', 'Rango'],
  buy: n => [`Requisition · ${n} Recruits`, `Requisar · ${n} reclutas`], owned: ['In your kit', 'En tu equipo'], capped: ['Fully upgraded', 'Al máximo'], earned: ['Earned', 'Ganado'],
  need: n => [`Needs ${n} Recruits`, `Necesita ${n} reclutas`], sRank: m => [`S rank on Mission ${m}`, `Rango S en la misión ${m}`],
  metis: ['Every dock hand you sent up signed with us. Spend them well.', 'Cada hombre del muelle que mandaste arriba firmó con nosotros. Úsalos bien.'],
};
let points = 7, tab = 0, sel = 0; const bought = { scanner: 1, magazines: 0, fultons: 0, darts: 0 }, got = { long_scan: false, heavy_suppressor: false, quick_hold: false };
const L = () => GL.es ? 1 : 0, val = (u, r) => u.base + u.step * r, list = () => tab ? ITEMS : UPG;
const $ = id => document.getElementById(id);
function render() {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', +t.dataset.tab === tab));
  $('cat').textContent = T.cat[tab][L()]; $('metis').textContent = T.metis[L()]; $('pointsN').textContent = points;
  let h = `<div class="rk"><span></span>${tab ? '' : [0, 1, 2].map(r => `<span><small>${T.rank[L()].toUpperCase()}</small><b>${r + 1}</b></span>`).join('')}</div>`;
  list().forEach((e, k) => {
    let cells = '';
    if (!tab) for (let r = 0; r <= e.buys; r++) {
      const own = r <= bought[e.id], next = r === bought[e.id] + 1, poor = next && points < e.price;
      cells += own ? `<div class="cl own"><svg viewBox="0 0 64 56"><use href="#${e.icon}"/></svg><span class="cnt num">×${val(e, r)}</span></div>`
        : next ? `<div class="cl next ${poor ? 'poor' : ''}"><svg viewBox="0 0 64 56"><use href="#${e.icon}"/></svg><span class="cnt num">×${val(e, r)}</span><span class="pr"><svg viewBox="0 0 40 46" style="width:14px;height:16px"><use href="#i-recruit"/></svg>${e.price}</span></div>`
        : `<div class="cl far"><svg viewBox="0 0 64 56"><use href="#${e.icon}"/></svg></div>`;
    } else cells = e.unlocked || got[e.id] ? `<div class="cl own"><svg viewBox="0 0 64 56"><use href="#${e.icon}"/></svg></div>` : `<div class="cl lock"><svg viewBox="0 0 64 56"><use href="#i-lock"/></svg></div>`;
    h += `<div class="rw" data-k="${k}" ${k === sel ? 'aria-selected="true"' : ''}><div class="lbl">${e.name[L()]}<small>${tab ? T.sRank(e.mission)[L()] : e.eff[L()]}</small></div>${cells}</div>`;
  });
  $('board').innerHTML = h;
  document.querySelectorAll('.rw').forEach(r => r.onclick = () => { sel = +r.dataset.k; render(); });
  const e = list()[sel]; let eff, btn, off = false;
  if (!tab) {
    const r = bought[e.id], done = r >= e.buys;
    eff = `<span>${e.eff[L()]}</span><span class="v num"><s>${val(e, r)}</s>${done ? '' : ` → <i>${val(e, r + 1)}</i>`}</span>`;
    btn = done ? T.capped[L()] : points < e.price ? T.need(e.price)[L()] : T.buy(e.price)[L()]; off = done || points < e.price;
  } else { eff = `<span>${e.eff[L()]}</span><span class="v num"><s>${e.from}</s> → <i>${e.to}</i></span>`; btn = e.unlocked ? T.owned[L()] : T.sRank(e.mission)[L()]; off = true; }
  const iso = id => `<svg viewBox="0 0 64 56" style="transform:translateZ(-10px);color:#000;opacity:.18;filter:blur(4px)"><use href="#${id}"/></svg>` + Array.from({ length: 12 }, (_, i) => `<svg viewBox="0 0 64 56" style="transform:translateZ(${i * 4}px);color:${i === 11 ? '#14181a' : `hsl(200 6% ${66 - i * 3.5}%)`}"><use href="#${id}"/></svg>`).join('');
  $('dwg').innerHTML = `<span class="tag">${['METIS R&D · DWG', 'METIS I+D · PLANO'][L()]}</span><h2>${e.name[L()]}</h2><div class="part">${e.part[L()]}</div>
    <div class="art"><div class="iso">${iso(e.icon)}</div><span class="sc">${['SCALE', 'ESCALA'][L()]} ${e.scale}</span></div>
    <div class="eff">${eff}</div><p>${e.desc[L()]}</p>
    <div class="buy ${off ? 'off' : ''}" id="buy">${off ? '' : '<span class="key sm">E</span>'}${btn}</div>`;
  $('buy').onclick = buy;
}
function buy() {
  if (tab) return; const e = UPG[sel];
  if (bought[e.id] >= e.buys || points < e.price) return;
  points -= e.price; bought[e.id]++; render();
  const p = $('pts'); p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash');
}
window.onLang = render;
$('t-reset').onclick = () => { points = 7; Object.keys(bought).forEach(k => bought[k] = k === 'scanner' ? 1 : 0); render(); };
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { tab = +t.dataset.tab; sel = 0; render(); });
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') sel = Math.min(list().length - 1, sel + 1); else if (e.key === 'ArrowUp') sel = Math.max(0, sel - 1);
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { tab = 1 - tab; sel = 0; } else if (e.key.toLowerCase() === 'e') return buy(); else return; render();
});
render();
</script>
</body>
</html>
