<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Layer Mission Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Antonio:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/kit.css">
<style>
.list { position: absolute; left: 80px; top: 230px; width: 760px; }
.list .row { height: 92px; gap: 24px; }
.list .n { font: 400 54px/1 var(--head); width: 70px; opacity: .55; }
.list .nm { font-size: 40px; letter-spacing: .08em; }
.list .nm small { display: block; font: 500 17px/1 var(--head); letter-spacing: .26em; margin-top: 8px; opacity: .65; }
.list .rk { margin-left: auto; width: 60px; height: 60px; display: grid; place-items: center; font: 600 38px/1 var(--head); background: rgba(236, 235, 227, .14); color: var(--ink); }
.list .row[aria-selected="true"] .rk { background: #0a0d0f; color: var(--ink); }
.list .row.locked .rk { background: none; border: 1px solid var(--line); color: var(--ink-3); font-size: 22px; }
.list .row.locked .nm small { opacity: .5; }
.rec { position: absolute; right: 80px; top: 230px; width: 760px; }
.rec .name { font: 700 74px/.95 var(--head); letter-spacing: .03em; text-transform: uppercase; }
.rec .loc { margin-top: 12px; font: 500 22px/1 var(--head); letter-spacing: .3em; color: var(--ink-2); text-transform: uppercase; }
.rec .grid { margin-top: 38px; display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 3px solid var(--ink); }
.rec .cell { padding: 20px 4px 22px; border-bottom: 1px solid var(--line); }
.rec .cell:nth-child(odd) { border-right: 1px solid var(--line); padding-right: 24px; }
.rec .cell:nth-child(even) { padding-left: 28px; }
.rec .cell b { display: block; margin-top: 10px; font: 500 64px/1 var(--head); letter-spacing: .04em; }
.rec .cell b small { font-size: 22px; color: var(--ink-3); letter-spacing: .2em; margin-left: 8px; }
.rec .rank { grid-column: 1 / -1; display: flex; align-items: center; height: 96px; margin-top: 26px; background: linear-gradient(90deg, #1b1a14 0%, #2c2818 40%, var(--gold) 100%); padding-left: 22px; border: 0; }
.rec .rank .lab { color: var(--ink-2); }
.rec .rank b { margin: 0 34px 0 auto; font: 700 84px/1 var(--head); color: #0a0d0f; }
.rec .go { margin-top: 36px; display: flex; justify-content: flex-end; }
.cap { position: absolute; left: 80px; right: 80px; bottom: 100px; }
.cap .t { display: flex; align-items: center; gap: 18px; font: 700 40px/1 var(--head); letter-spacing: .1em; text-transform: uppercase; padding-bottom: 14px; }
.cap .t svg { width: 40px; height: 40px; }
.cap .rule { height: 2px; background: var(--ink); }
.cap p { margin-top: 14px; font: 400 24px/1.3 var(--body); color: var(--ink-2); }
</style>
</head>
<body>
<div class="mockbar" role="toolbar" aria-label="Mock controls">
  <span class="title">Ghost Layer · Mission select</span>
  <a href="index.html">All screens</a><span class="sep"></span>
  <button id="t-replay">Replay</button><span class="grow"></span>
  <span class="hint">↑ ↓ pick · click a row</span><span class="sep"></span>
  <button id="t-lang" aria-pressed="false">Español</button>
</div>
<div class="viewport"><div class="stage" id="stage">
  <div class="scene dim"></div>
  <div class="vig"></div>

  <div class="hdr"><div class="t a l"><svg class="em"><use href="#emblem"/></svg><span data-es="Misión">Mission</span></div><div class="rule a w" style="--d:.2s"></div></div>

  <div class="list rows" id="list"></div>
  <div class="rec">
    <div class="a r" style="--d:.2s" id="recHead"></div>
    <div class="grid a r" style="--d:.3s" id="recGrid"></div>
    <div class="go a r" style="--d:.5s"><span class="slab white"><span class="key sm">E</span><span data-es="Desplegar">Deploy</span></span></div>
  </div>

  <div class="cap a" style="--d:.6s">
    <div class="t"><svg><use href="#emblem"/></svg><span data-es="Selector de misión">Mission selector</span></div>
    <div class="rule"></div>
    <p id="capText"></p>
  </div>
  <div class="prompts"><span><span class="key sm dark">↑↓</span><span data-es="Elegir">Select</span></span><span><span class="key sm dark">E</span><span data-es="Desplegar">Deploy</span></span><span class="r"><span class="key sm dark">Esc</span><span data-es="Atrás">Back</span></span></div>
  <div class="scan"></div>
</div></div>
<script src="kit/sprite.js"></script>
<script src="kit/kit.js"></script>
<script>
const M = [
  { n: '01', en: 'Harbour', es: 'Puerto', loc: ['Palladion Island · the docks', 'Isla Palladion · los muelles'], rank: 'B', time: '6:52', kills: '0', alerts: '1' },
  { n: '02', en: 'Radio Relay Station', es: 'Estación de relé', loc: ['Palladion Island · the summit relay', 'Isla Palladion · el relé de la cumbre'], rank: 'A', time: '9:14', kills: '0', alerts: '0' },
  { n: '03', en: 'Research Annex', es: 'Anexo de investigación', locked: true, loc: ['Clear the Relay Station first', 'Supera la Estación de relé primero'] },
  { n: '04', en: 'Aigis core', es: 'Núcleo de Aigis', locked: true, loc: ['Locked', 'Bloqueada'] },
];
let sel = 1;
const L = () => GL.es ? 1 : 0;
function render() {
  document.getElementById('list').innerHTML = M.map((m, i) => `<div class="row ${m.locked ? 'locked' : ''}" ${i === sel ? 'aria-selected="true"' : ''} data-i="${i}">
    <span class="n num">${m.n}</span><span class="nm">${[m.en, m.es][L()]}<small>${m.locked ? [m.loc[0], m.loc[1]][L()] : ['Cleared', 'Superada'][L()]}</small></span><span class="rk">${m.locked ? '—' : m.rank}</span></div>`).join('');
  const m = M[sel];
  document.getElementById('recHead').innerHTML = `<div class="name">${[m.en, m.es][L()]}</div><div class="loc">${m.loc[L()]}</div>`;
  document.getElementById('recGrid').innerHTML = m.locked ? `<div class="cell" style="grid-column:1/-1"><span class="lab">${['Mission record', 'Récord de misión'][L()]}</span><b style="color:var(--ink-3)">—</b></div>` : `
    <div class="cell"><span class="lab">${['Fastest time', 'Tiempo récord'][L()]}</span><b class="num">${m.time}</b></div>
    <div class="cell"><span class="lab">${['Fewest kills', 'Menos bajas'][L()]}</span><b class="num">${m.kills}</b></div>
    <div class="cell"><span class="lab">${['Fewest alerts', 'Menos alertas'][L()]}</span><b class="num">${m.alerts}</b></div>
    <div class="cell"><span class="lab">${['Recruits', 'Reclutas'][L()]}</span><b class="num">${m.n === '01' ? 5 : 3}<small>${['SIGNED', 'FIRMADOS'][L()]}</small></b></div>
    <div class="cell rank"><span class="lab">${['Best rank', 'Mejor rango'][L()]}</span><b>${m.rank}</b></div>`;
  document.getElementById('capText').textContent = ['Replay a cleared Mission. Your Profile and Lethality stay untouched.', 'Repite una misión superada. Tu Perfil y tu Letalidad no cambian.'][L()];
  document.querySelectorAll('.list .row').forEach(r => r.onclick = () => { sel = +r.dataset.i; render(); });
}
window.onLang = render; render();
addEventListener('keydown', e => { if (e.key === 'ArrowDown') sel = Math.min(M.length - 1, sel + 1); else if (e.key === 'ArrowUp') sel = Math.max(0, sel - 1); else return; render(); });
</script>
</body>
</html>
