<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Layer HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Antonio:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/kit.css">
<style>
.stage .scene { filter: contrast(1.05) saturate(.92); transition: filter .4s var(--ease); }
body[data-state="radio"] .scene, body[data-state="radio"] .guard { filter: grayscale(.85) brightness(.5) contrast(1.1); }
body[data-state="alert"] .tint { opacity: 1; }
.tint { position: absolute; inset: 0; opacity: 0; transition: opacity .5s; background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(196, 32, 50, .38) 100%); pointer-events: none; }
.guard { position: absolute; left: 1222px; top: 748px; }
.hud { position: absolute; inset: 0; perspective: 1500px; }
.cn { position: absolute; transform-style: preserve-3d; transition: transform .5s var(--ease); }
.cn.l { transform-origin: left center; transform: none; }
.cn.r { transform-origin: right center; transform: none; }
[data-on] { transition: opacity .25s var(--ease), transform .35s var(--ease); }
.off { opacity: 0 !important; pointer-events: none; }
.vig::after { display: none; }
.sh { text-shadow: 0 2px 0 #000, 0 0 10px rgba(0, 0, 0, .6); }

/* Aigis, top-left */
.aigis { left: 70px; top: 56px; }
.aigis .vc { display: flex; align-items: center; gap: 12px; font: 700 22px/1 var(--head); letter-spacing: .34em; color: var(--cyan); }
.aigis .vc svg { width: 26px; height: 26px; }
.aigis .hs { display: flex; gap: 14px; margin-top: 14px; }
.aigis .h { position: relative; width: 38px; text-align: center; }
.aigis .h svg { width: 30px; height: 30px; color: rgba(236, 235, 227, .8); filter: drop-shadow(0 1px 0 #000); }
.aigis .h .p { display: flex; gap: 2px; justify-content: center; margin-top: 4px; } .aigis .h .p i { width: 9px; height: 3px; background: rgba(236, 235, 227, .3); } .aigis .h .p i.on { background: var(--gold); }
.aigis .h.up::after { content: ""; position: absolute; right: -3px; top: -4px; border: 5px solid transparent; border-bottom: 8px solid var(--gold); border-top: 0; }

/* phase plate, top-centre */
.phase { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); display: flex; align-items: stretch; }
.phase .w { padding: 11px 26px 10px 36px; background: var(--red); font: 700 28px/1 var(--head); letter-spacing: .5em; clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%); }
.phase .t { padding: 11px 30px 10px 22px; margin-left: -14px; background: rgba(8, 11, 13, .86); font: 600 28px/1 var(--head); letter-spacing: .1em; clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%); border-bottom: 3px solid var(--red); }
.phase.ev .w { background: rgba(8, 11, 13, .86); border-bottom: 3px solid var(--red); color: var(--red-hi); }

/* radar, top-right */
.radar { right: 70px; top: 52px; width: 310px; height: 310px; }
.radar .disc { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(10, 18, 20, .74), rgba(6, 10, 12, .88)); border: 2px solid rgba(236, 235, 227, .85); }
.radar svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.radar .jam { position: absolute; inset: 3px; border-radius: 50%; display: grid; place-items: center; background: repeating-linear-gradient(0deg, #1a0709 0 3px, #2a0c10 3px 6px); font: 700 24px/1 var(--head); letter-spacing: .4em; color: var(--red-hi); text-align: center; padding-left: .4em; animation: flash 1s steps(2) infinite; }

.rsweep { animation: spin 5s linear infinite; transform-origin: 0 0; }

/* life, bottom-left */
.life { left: 70px; bottom: 70px; height: 340px; display: flex; gap: 12px; align-items: flex-end; }
.life .g { position: relative; width: 14px; height: 100%; background: rgba(8, 11, 13, .62); border: 1px solid rgba(236, 235, 227, .5); }
.life .g i { position: absolute; left: 1px; right: 1px; bottom: 1px; height: 78%; background: var(--ink); }

/* weapon + item cards, bottom-right */
.cards { right: 70px; bottom: 66px; width: 400px; }
.card { position: relative; background: rgba(10, 14, 16, .66); border: 1px solid rgba(236, 235, 227, .5); }
.card .nm { position: absolute; left: 12px; top: 9px; font: 600 20px/1 var(--head); letter-spacing: .14em; text-transform: uppercase; }
.card .tag { display: inline-block; margin-left: 8px; padding: 2px 6px 1px; background: var(--blue); font: 700 13px/1 var(--head); letter-spacing: .1em; vertical-align: 2px; }
.card .ic { position: absolute; color: rgba(236, 235, 227, .86); }
.card .ct { position: absolute; right: 14px; bottom: 6px; font: 600 48px/1 var(--head); letter-spacing: .04em; }
.card .ct small { font-size: 24px; color: var(--ink-3); }
.card .star { position: absolute; right: 10px; top: 8px; font: 600 16px/1 var(--head); letter-spacing: .12em; color: var(--ink-2); }
.wep { height: 150px; margin-left: 24px; }
.wep .ic { left: 50px; top: 46px; width: 200px; height: 76px; }
.itm { height: 98px; width: 330px; margin-left: 94px; margin-bottom: 14px; }
.itm .ic { left: 30px; top: 34px; width: 90px; height: 50px; }
.itm .ct { font-size: 38px; }
.ticks { position: relative; height: 6px; margin: 12px 0 0 24px; background: rgba(236, 235, 227, .22); }
.ticks::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--fill, 100%); background: var(--ink); transition: width .3s var(--ease); }

/* world marks */
.mark { position: absolute; left: 1262px; top: 742px; transform: translate(-50%, -100%); font: 700 60px/1 Barlow, var(--body); color: var(--ink); text-shadow: 0 2px 0 #000, 0 0 12px rgba(0, 0, 0, .6); }
.mark.b { color: #e0423a; font-size: 72px; animation: pop .28s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes pop { from { transform: translate(-50%, -100%) scale(.4); } }
.pr { position: absolute; left: 1090px; top: 780px; flex-direction: row-reverse; display: flex; align-items: center; gap: 0; }
.pr .ln { width: 50px; height: 2px; background: var(--ink); margin-left: -2px; }
.pr .act { position: relative; width: 82px; height: 82px; display: grid; place-items: center; background: rgba(8, 11, 13, .72); border: 2px solid var(--ink); }
.pr .act svg { width: 48px; height: 48px; }
.pr .key { position: absolute; left: -22px; top: -22px; }
.pr.b2 { left: 1110px; top: 870px; }

/* item selector: a short strip that slides out of the item card, no panel, no description */
.sel { position: absolute; right: 412px; bottom: 247px; display: flex; flex-direction: row-reverse; align-items: flex-end; gap: 6px; }
.sl { position: relative; width: 78px; height: 98px; background: rgba(8, 11, 13, .62); border: 1px solid rgba(236, 235, 227, .16); display: grid; place-items: center; color: var(--ink); }
.sl svg { width: 44px; height: 44px; }
.sl .nm { display: none; }
.sl .c { position: absolute; right: 8px; bottom: 6px; font: 700 20px/1 var(--head); }
.sl.e { background: transparent; border-style: dashed; border-color: rgba(236, 235, 227, .14); }
.sl.on { width: 92px; height: 112px; background: var(--ink); color: #0a0d0f; border-color: var(--ink); }
.sl.on svg { width: 54px; height: 54px; }
.sel .tag-n { position: absolute; right: 0; top: -34px; padding: 6px 12px 5px; background: var(--ink); color: #0a0d0f; font: 700 20px/1 var(--head); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
body[data-state="selector"] .sel { animation: selout .2s steps(6) both; }
body[data-state="selector"] .sl { animation: slin .22s steps(4) calc(var(--i, 0) * 35ms) both; }
body[data-state="selector"] .itm { border-color: var(--ink); }
@keyframes selout { from { clip-path: inset(-40px 0 0 100%); } to { clip-path: inset(-40px 0 0 0); } }
@keyframes slin { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }

/* radio: segmented ring left of centre, labels outside, step name in the middle (ui/radio/radio.gd) */
.radio { position: absolute; inset: 0; --sand: #c9bfa4; }
.radio .backing { position: absolute; left: 516px; top: 530px; width: 460px; height: 460px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(12, 14, 15, .6) 50%, rgba(12, 14, 15, 0) 70%); }
.radio svg.ring { position: absolute; left: 0; top: 0; }
.radio .seg { transition: stroke .12s steps(1); stroke: rgba(242, 244, 243, .12); }
.radio .seg.on { stroke: rgba(201, 191, 164, .72); }
.radio .crumb { position: absolute; left: 516px; top: 296px; transform: translateX(-50%); white-space: nowrap; font: 600 17px/1 var(--head); letter-spacing: .14em; color: var(--ink-3); text-transform: uppercase; }
.radio .crumb b { color: var(--ink-2); font-weight: 600; }
.radio .stepname { position: absolute; left: 516px; top: 530px; transform: translate(-50%, -50%); font: 600 20px/1 var(--head); letter-spacing: .24em; padding-left: .24em; color: var(--sand); }
.radio .lbl { position: absolute; font: 600 22px/1 var(--head); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; cursor: default; }
.radio .lbl i { font-style: normal; margin-right: 8px; opacity: .7; }
.radio .lbl.on { color: var(--sand); }
.radio .referent { position: absolute; left: 1214px; top: 726px; width: 96px; height: 206px; animation: ref 1.2s steps(2) infinite; }
@keyframes ref { 50% { opacity: .55; } }
.radio .referent::before, .radio .referent::after { content: ""; position: absolute; width: 22px; height: 22px; border: 2px solid var(--ink); }
.radio .referent::before { left: 0; top: 0; border-right: 0; border-bottom: 0; }
.radio .referent::after { right: 0; bottom: 0; border-left: 0; border-top: 0; }
.radio .referent span { position: absolute; left: 50%; top: -26px; transform: translateX(-50%); white-space: nowrap; font: 600 16px/1 var(--head); letter-spacing: .14em; text-transform: uppercase; }
body[data-state="radio"] .guard { filter: brightness(2.6) contrast(.5) !important; }
body[data-state="radio"] .radio .ring { animation: ringin .22s steps(6) both; transform-origin: 516px 530px; }
@keyframes ringin { from { opacity: 0; transform: scale(.88); } to { opacity: 1; transform: none; } }

/* Codec call during play: middle left, narrow */
.csub { position: absolute; left: 64px; top: 410px; width: 430px; }
.csub .box { display: flex; gap: 16px; align-items: flex-start; padding: 12px 18px 14px 12px; background: rgba(6, 9, 11, .74); border-top: 2px solid #8fd9c0; }
.csub .pt { position: relative; flex: none; width: 76px; height: 76px; overflow: hidden; border: 1px solid rgba(143, 217, 192, .6); }
.csub .pt img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; filter: grayscale(1) contrast(1.4); }
.csub .pt::before { content: ""; position: absolute; inset: 0; z-index: 1; background: #8fd9c0; mix-blend-mode: multiply; }
.csub .who { display: flex; align-items: center; gap: 10px; font: 700 18px/1 var(--head); letter-spacing: .3em; color: #8fd9c0; }
.csub .who i { display: flex; gap: 2px; align-items: center; height: 14px; } .csub .who i b { width: 3px; height: 100%; background: #8fd9c0; animation: wv .4s steps(3) infinite alternate; transform-origin: center; } .csub .who i b:nth-child(2) { animation-delay: -.15s; } .csub .who i b:nth-child(3) { animation-delay: -.3s; }
@keyframes wv { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
.csub .tx { margin-top: 10px; font: 500 24px/1.3 var(--body); }

</style>
</head>

<script>
const S = ['sneak', 'noticed', 'alert', 'selector', 'radio', 'call'];
let aigis = true;
function apply(s) {
  document.body.dataset.state = s;
  document.querySelectorAll('[data-s]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === s));
  document.querySelectorAll('[data-on]').forEach(el => {
    let on = el.dataset.on.split(' ').includes(s);
    if (el.hasAttribute('data-aigis') && !aigis) on = false;
    el.classList.toggle('off', !on);
  });
  document.querySelector('.phase').classList.toggle('ev', false);
}
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => apply(b.dataset.s));
document.getElementById('t-aigis').onclick = e => { aigis = !aigis; e.target.setAttribute('aria-pressed', aigis); apply(document.body.dataset.state); };
addEventListener('keydown', e => { const k = +e.key; if (k >= 1 && k <= 6) apply(S[k - 1]); });
const slots = [...document.querySelectorAll('.sel .sl:not(.e)')];
const tagn = () => { const on = document.querySelector('.sel .sl.on'); document.getElementById('tagn').textContent = GL.es ? on.dataset.nes : on.dataset.n; };
slots.forEach(sl => sl.addEventListener('mouseenter', () => { slots.forEach(x => x.classList.toggle('on', x === sl)); tagn(); GL.tick(); }));
window.onLang = tagn;
const pick = o => {
  document.querySelectorAll('.radio .seg').forEach(x => x.classList.toggle('on', +x.dataset.o === o));
  document.querySelectorAll('.radio .lbl').forEach(x => x.classList.toggle('on', +x.dataset.o === o));
};
document.querySelectorAll('.radio .lbl').forEach(l => l.addEventListener('mouseenter', () => { pick(+l.dataset.o); GL.tick(); }));
addEventListener('keydown', e => { if (document.body.dataset.state === 'radio' && /^[1-3]$/.test(e.key)) { e.stopImmediatePropagation(); pick(+e.key - 1); } }, true);
apply('sneak');
</script>
